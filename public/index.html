<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spark AI</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Runs before the page paints, so there is no flash of the wrong theme or sidebar state -->
    <script>
        (function () {
            var root = document.documentElement;
            var theme = "dark";
            var open = true;
            try {
                theme = localStorage.getItem("spark_theme") || "dark";
                open = localStorage.getItem("spark_sidebar") !== "0";
            } catch (e) {}
            if (window.matchMedia("(max-width: 820px)").matches) open = false;
            root.setAttribute("data-theme", theme);
            if (open) root.classList.add("sidebar-open");
        })();
    </script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">

        <!-- Sidebar: chat history -->
        <aside class="sidebar" id="sidebar" aria-label="Chat history">
            <div class="sidebar-top">
                <button id="newChatBtn" class="new-chat-btn" type="button">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                    <span>New chat</span>
                </button>
            </div>

            <nav class="chat-list" id="chatList" aria-label="Previous chats"></nav>

            <div class="sidebar-foot">
                <button id="clearAllBtn" class="ghost-btn" type="button" hidden>
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>
                    </svg>
                    <span>Clear all chats</span>
                </button>
            </div>
        </aside>

        <div class="backdrop" id="backdrop"></div>

        <!-- Main column -->
        <div class="main">
            <header class="topbar">
                <div class="topbar-left">
                    <button id="sidebarToggle" class="icon-btn" type="button" aria-label="Toggle chat history" aria-controls="sidebar" aria-expanded="true" title="Chat history">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="4" width="18" height="16" rx="3"/>
                            <path d="M9 4v16"/>
                        </svg>
                    </button>

                    <div class="brand">
                        <div class="logo">
                            <img src="ai.png" alt="Spark AI">
                        </div>
                        <div>
                            <h1>Spark AI</h1>
                            <p>Your personal AI assistant</p>
                        </div>
                    </div>
                </div>

                <button id="themeBtn" class="icon-btn theme-btn" type="button" aria-label="Switch to light mode" title="Switch theme">
                    <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="4"/>
                        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                    </svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
                    </svg>
                </button>
            </header>

            <main id="chatBox" class="chat" aria-live="polite">
                <div class="chat-inner" id="chatInner"></div>
            </main>

            <div class="composer-wrap">
                <form id="chatForm" class="composer">
                    <div class="attach-tray" id="attachTray" hidden></div>

                    <button id="attachBtn" class="attach-btn" type="button" aria-label="Attach files" title="Attach images, PDFs or text files">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M21.4 11.1l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/>
                        </svg>
                    </button>
                    <input id="fileInput" type="file" multiple hidden
                        accept="image/png,image/jpeg,image/webp,image/gif,application/pdf,text/*,.txt,.md,.csv,.json,.js,.ts,.jsx,.tsx,.py,.java,.c,.cpp,.cs,.go,.rs,.php,.rb,.sh,.sql,.html,.css,.xml,.yaml,.yml,.log">

                    <textarea
                        id="userInput"
                        rows="1"
                        placeholder="Ask me anything..."
                        autocomplete="off"
                        aria-label="Message"
                    ></textarea>
                    <button id="sendBtn" class="send-btn" type="submit" aria-label="Send message" disabled>
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 19V5M5 12l7-7 7 7"/>
                        </svg>
                    </button>
                </form>
                <p class="note">Made with Love ❤️</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
